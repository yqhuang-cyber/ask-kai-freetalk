name: Frozen Agent preregistered root cause contrasts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/live/root-cause-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-agent-root-cause
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Reuse the exact authored PCM from Task 02
        uses: actions/download-artifact@v4
        with:
          name: task02-authored-input-fixtures
          path: .local/task03-source-fixtures
          run-id: 38196302477
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fixed root cause scope without changing the Agent
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: node scripts/actions-root-cause.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task03-root-cause-evidence
          path: |
            .local/root-cause/request.json
            .local/root-cause/plan.json
            .local/root-cause/failure.json
            .local/root-cause/root-cause-report.json
            .local/root-cause/trials/*/observations.json
            .local/root-cause/trials/*/collection-report.json
            .local/root-cause/trials/*/trial.json
            .local/root-cause/trials/*/protocol-diagnostics.json
          retention-days: 7
