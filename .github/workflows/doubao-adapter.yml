name: Doubao live adapter repair probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/live/doubao-adapter-request.json']
permissions:
  contents: read
concurrency:
  group: doubao-live-adapter
  cancel-in-progress: false
jobs:
  adapter:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Production adapter output, update, cancel, resume and close
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: node scripts/actions-doubao-adapter.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doubao-adapter-metadata
          path: .local/doubao-adapter/result.json
          retention-days: 3
