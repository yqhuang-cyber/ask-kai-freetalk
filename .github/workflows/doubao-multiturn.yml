name: Doubao first-case multi-turn trial
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/live/doubao-multiturn-request.json']
permissions:
  contents: read
concurrency:
  group: doubao-multiturn-trial
  cancel-in-progress: false
jobs:
  trial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: First authored case through the production Agent gateway
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: node scripts/actions-doubao-multiturn.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doubao-multiturn-trial
          path: |
            .local/doubao-multiturn/trial-report.json
            .local/doubao-multiturn/report.json
            .local/doubao-multiturn/observations.json
            .local/doubao-multiturn/audio-manifest.json
          retention-days: 3
